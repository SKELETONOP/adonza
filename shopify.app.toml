# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "76f4df956871532c2101908e84d65451"
name = "Adonza"
application_url = "https://adonza-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_discounts,write_discounts"

# The storefront asset (extensions/bogo-free-gift) calls this proxy at
# /apps/bogo/rules to fetch this shop's active Buy-X-Get-Y rules.
# `shopify app dev` / `shopify app deploy` keep the `url` in sync with your
# current app URL automatically - you don't need to edit it by hand.
[app_proxy]
url = "https://adonza-production.up.railway.app"
prefix = "apps"
subpath = "bogo"

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[auth]
redirect_urls = [ "https://adonza-production.up.railway.app/auth/callback" ]
